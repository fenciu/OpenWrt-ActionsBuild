name: 编译固件_自定义仓库_容器

on: 
  repository_dispatch:
  workflow_dispatch:
    inputs:
      resource_directory:
        type: choice
        description: '路由器资源目录'
        options:
          - "P2W_R619AC-128M"
          - "XIAOMI-4A_100M"
          - "XIAOMI-4A_GIGABit"
      repo_url:
        description: '仓库地址'
        default: 'https://github.com/x-wrt/x-wrt'
      repo_branch:
        description: '版本分支'
        default: 'v21.02.1'
      feeds_file:
        type: choice
        description: '替换软件源配置(feeds.conf.default)'
        options:
        - "true"
        - "false"
      config_file:
        description: 'config 文件名称(.config)'
        default: '.config'
      files_path:
        type: choice
        description: '导入补丁目录(files目录)'
        options:
        - "true"
        - "false"
      openwrt_patch:
        type: choice
        description: '执行仓库脚本(openwrt_patch.sh)'
        options:
        - "true"
        - "false"
      befor_patch:
        type: choice
        description: '执行编译前脚本(make_befor.sh)'
        options:
        - "true"
        - "false"
      after_patch:
        type: choice
        description: '执行编译后脚本(make_after.sh)'
        options:
        - "true"
        - "false"
      upload_release:
        type: choice
        description: '发布到release'
        options:
        - "false"
        - "true"
env:
  TIMEZONE: Asia/Shanghai
  
  UPLOAD_ACTIONSRUNS: true
  
  Resoure_DIR: ${{ github.event.inputs.resource_directory }}
  
  REPO_URL: ${{ github.event.inputs.repo_url }}
  
  REPO_BRANCH: ${{ github.event.inputs.repo_branch }}
  CONFIG_FILE: '${{ github.event.inputs.resource_directory }}/${{ github.event.inputs.config_file }}'
  FEEDS_FILE: '${{ github.event.inputs.resource_directory }}/feeds.conf.default'
  REPLACE_FEEDS: ${{ github.event.inputs.feeds_file }}
  LOAD_FILES: ${{ github.event.inputs.files_path }}
  FILES_PATH: '${{ github.event.inputs.resource_directory }}/files'
  RUN_OPENWRTPATCH: ${{ github.event.inputs.openwrt_patch }}
  OPENWRT_PATCH: '${{ github.event.inputs.resource_directory }}/openwrt_patch.sh'
  RUN_BEFORPATCH: ${{ github.event.inputs.befor_patch }}
  BEFOR_PATCH: '${{ github.event.inputs.resource_directory }}/make_befor.sh'
  RUN_AFTERPATCH: ${{ github.event.inputs.after_patch }}
  AFTER_PATCH: '${{ github.event.inputs.resource_directory }}/make_after.sh'
  UPLOAD_RELEASE: ${{ github.event.inputs.upload_release }}
  
  
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Free Disk Space (Ubuntu)
      uses: jlumbroso/free-disk-space@main
      with:
        # this might remove tools that are actually needed,
        # if set to "true" but frees about 6 GB
        tool-cache: true
    
        # all of these default to true, but feel free to set to
        # "false" if necessary for your workflow
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        swap-storage: true
    - name: Disk space
      run: |
           echo "Free space:"
           df -h
    - name: 检出仓库数据
      uses: actions/checkout@main

    - name: Run containerized build step
      uses: addnab/docker-run-action@v3
      with:
        image: ubuntu:noble
        options: --user root
        volumes: ${{ github.event.inputs.resource_directory }}:${{ github.event.inputs.resource_directory }}
        run: |
          apt-get  upgrade -y
          apt-get install -y  curl build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev python3-setuptools rsync swig unzip zlib1g-dev file wget language-pack-zh-hans
          apt -qq autoremove --purge
          apt -qq clean
          export FORCE_UNSAFE_CONFIGURE=1
          mkdir -p /workdir
          mkdir -p /tmp 
          chmod 777 /tmp
          git clone $REPO_URL 
          ln -sf /workdir/x-wrt $GITHUB_WORKSPACE/x-wrt
          [ -e $FEEDS_FILE ] && rm -f x-wrt/feeds.conf.default
          [ -e $FEEDS_FILE ] && mv $FEEDS_FILE x-wrt/feeds.conf.default
          cd x-wrt 
          ./scripts/feeds update -a && ./scripts/feeds install -a
          ./scripts/feeds update -a && ./scripts/feeds install -a
          make defconfig
          make download -j8
          find dl -size -1024c -exec ls -l {} \;
          find dl -size -1024c -exec rm -f {} \;
          make -j1  V=s
    
    
    - name: 整理文件
      id: organize
      if: steps.makefirmware.outputs.status == 'success'
      run: |
        cd x-wrt/bin/targets/*/*
        cp ../../../../.config ./build.config
        cp ../../../../feeds.conf.default ./feeds.conf.default
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        echo "::set-output name=status::success"
        
    - name: 上传固件
      uses: actions/upload-artifact@main
      if: env.UPLOAD_ACTIONSRUNS == 'true' && steps.organize.outputs.status == 'success'
      with:
        name: OpenWrt_firmware${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: ${{ env.FIRMWARE }}
    
    - name: 清理ActionsRuns旧数据
      uses: GitRML/delete-workflow-runs@main
      with:
        retain_days: 1
        keep_minimum_runs: 5
        
    - name: 生成release标签
      id: releasetag
      if: env.UPLOAD_RELEASE == 'true' && steps.makefirmware.outputs.status == 'success' && !cancelled()
      run: |
        echo "::set-output name=release_tag::$(date +"%Y.%m.%d-%H%M")"
        touch release.txt
        [ $UPLOAD_COWTRANSFER = true ] && echo "🔗 [Cowtransfer](${{ steps.cowtransfer.outputs.url }})" >> release.txt
        [ $UPLOAD_WETRANSFER = true ] && echo "🔗 [WeTransfer](${{ steps.wetransfer.outputs.url }})" >> release.txt
        echo "::set-output name=status::success"
        
    - name: 上传固件到Release
      uses: softprops/action-gh-release@v1
      if: env.UPLOAD_RELEASE == 'true' && steps.releasetag.outputs.status == 'success' && !cancelled()
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.releasetag.outputs.release_tag }}
        body_path: release.txt
        files: ${{ env.FIRMWARE }}/*
        
    - name: 清理Releases旧数据
      uses: dev-drprasad/delete-older-releases@v0.1.0
      if: env.UPLOAD_RELEASE == 'true' && !cancelled()
      with:
        keep_latest: 2
        delete_tags: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
